<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProcScope — live syscall stream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ProcScope</h1>
  <input id="filter" placeholder='filter: pid=42 syscall=open* path=/etc/**' spellcheck="false">
  <span id="status" class="status connecting">connecting…</span>
</header>
<main>
  <section id="feed-panel">
    <h2>syscall flow</h2>
    <table id="feed"><thead><tr><th>time</th><th>pid</th><th>comm</th><th>syscall</th><th>result</th><th>µs</th><th>path</th></tr></thead><tbody></tbody></table>
  </section>
  <aside>
    <section id="heat-panel">
      <h2>activity heatmap <small>(last 60 buckets × 1s)</small></h2>
      <canvas id="heat" width="720" height="180"></canvas>
      <div id="heat-legend"></div>
    </section>
    <section id="tree-panel">
      <h2>process tree</h2>
      <ul id="tree"></ul>
    </section>
    <section id="top-panel">
      <h2>top syscalls</h2>
      <table id="top"><thead><tr><th>syscall</th><th>count</th><th>avg µs</th></tr></thead><tbody></tbody></table>
    </section>
  </aside>
</main>
<script>const replayParams = new URLSearchParams({replay: "session.jsonl"});</script>
<script src="app.js"></script>
</body>
</html>
